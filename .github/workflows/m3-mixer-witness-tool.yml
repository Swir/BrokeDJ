name: M3 mixer recording witness tool

on:
  pull_request:
    paths:
      - 'scripts/m3_mixer_recording_witness.ps1'
      - 'docs/M3_MIXER_RECORDING_WITNESS.md'
      - '.github/workflows/m3-mixer-witness-tool.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-witness-tool:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Parse PowerShell witness script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\m3_mixer_recording_witness.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host 'PowerShell parser: OK'

      - name: Validate M3 evidence contract and negative cases
        shell: pwsh
        run: |
          Set-Content -LiteralPath .\BrokeDJ.exe -Value 'BrokeDJ M3 witness fixture executable' -NoNewline -Encoding ascii
          $appFile = Get-Item -LiteralPath .\BrokeDJ.exe
          $appHash = (Get-FileHash -LiteralPath .\BrokeDJ.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $appVersion = $appFile.VersionInfo.FileVersion
          if ([string]::IsNullOrWhiteSpace($appVersion)) { $appVersion = 'unknown' }

          $complete = [ordered]@{
            schema = 1
            project = 'BrokeDJ'
            scope = 'M3-mixer-recording'
            generatedUtc = [DateTime]::UtcNow.ToString('o')
            environment = [ordered]@{
              windowsBuild = 26100
              architecture = 'X64'
              processArchitecture = 'X64'
            }
            app = [ordered]@{
              fileName = 'BrokeDJ.exe'
              fileVersion = [string]$appVersion
              sha256 = $appHash
            }
            session = [ordered]@{
              continuousMinutes = 60
              representativeTrackCount = 3
              userOwnedOrLicensed = $true
            }
            checks = [ordered]@{
              eqListeningReviewed = $true
              gainStagingReviewed = $true
              crossfaderLawsReviewed = $true
              limiterBehaviorReviewed = $true
              microphoneInputReviewed = $true
              duckingReviewed = $true
              boothRoutingReviewed = $true
              cueIsolationPreserved = $true
              recordingCreated = $true
              recordingPlaybackReviewed = $true
              zeroRecordingDropoutsObserved = $true
              runtimeErrorReview = $true
            }
            privacy = [ordered]@{
              containsDeviceNames = $false
              containsTrackPaths = $false
              containsTrackNames = $false
              containsRecordingPaths = $false
              containsSourceMusic = $false
              containsMicrophoneAudio = $false
            }
          }

          $complete | ConvertTo-Json -Depth 8 | Set-Content .\complete.json -Encoding utf8
          & pwsh -NoProfile -File .\scripts\m3_mixer_recording_witness.ps1 `
            -AppPath .\BrokeDJ.exe -EvidencePath .\complete.json -ValidateExisting
          if ($LASTEXITCODE -ne 0) { throw 'Complete M3 mixer/recording fixture was rejected.' }

          function Assert-Rejected([object]$Fixture, [string]$Path, [string]$Message) {
            $Fixture | ConvertTo-Json -Depth 8 | Set-Content $Path -Encoding utf8
            & pwsh -NoProfile -File .\scripts\m3_mixer_recording_witness.ps1 `
              -AppPath .\BrokeDJ.exe -EvidencePath $Path -ValidateExisting
            if ($LASTEXITCODE -eq 0) { throw $Message }
            $global:LASTEXITCODE = 0
          }

          $shortSession = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $shortSession.session.continuousMinutes = 59
          Assert-Rejected $shortSession '.\short-session.json' 'Too-short M3 session was accepted.'

          $tooFewTracks = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $tooFewTracks.session.representativeTrackCount = 2
          Assert-Rejected $tooFewTracks '.\too-few-tracks.json' 'Too-small representative set was accepted.'

          $unlicensed = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $unlicensed.session.userOwnedOrLicensed = $false
          Assert-Rejected $unlicensed '.\unlicensed.json' 'Unlicensed-material attestation was accepted.'

          $spoofedBoolean = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $spoofedBoolean.checks.zeroRecordingDropoutsObserved = 'true'
          Assert-Rejected $spoofedBoolean '.\spoofed-boolean.json' 'String boolean was accepted.'

          $spoofedMinutes = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $spoofedMinutes.session.continuousMinutes = '60'
          Assert-Rejected $spoofedMinutes '.\spoofed-minutes.json' 'String session duration was accepted.'

          $incomplete = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $incomplete.checks.recordingPlaybackReviewed = $false
          Assert-Rejected $incomplete '.\incomplete.json' 'Incomplete M3 evidence was accepted.'

          $privacyLeak = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $privacyLeak.privacy.containsRecordingPaths = $true
          Assert-Rejected $privacyLeak '.\privacy-leak.json' 'Privacy-unsafe M3 evidence was accepted.'

          $extraField = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $extraField | Add-Member -NotePropertyName recordingPath -NotePropertyValue 'private'
          Assert-Rejected $extraField '.\extra-field.json' 'Unexpected free-form evidence field was accepted.'

          $appMismatch = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $appMismatch.app.sha256 = ('b' * 64)
          Assert-Rejected $appMismatch '.\app-mismatch.json' 'Wrong executable fingerprint was accepted.'

          $wrongArchitecture = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $wrongArchitecture.environment.architecture = 'X86'
          Assert-Rejected $wrongArchitecture '.\wrong-architecture.json' 'Non-x64 evidence was accepted.'

          Remove-Item .\must-not-exist.json -ErrorAction SilentlyContinue
          & pwsh -NoProfile -File .\scripts\m3_mixer_recording_witness.ps1 `
            -AppPath .\BrokeDJ.exe -EvidencePath .\must-not-exist.json `
            -ContinuousSessionMinutes 60 -RepresentativeTrackCount 3 -UserOwnedOrLicensed `
            -EqListeningReviewed -GainStagingReviewed -CrossfaderLawsReviewed `
            -LimiterBehaviorReviewed -MicrophoneInputReviewed -DuckingReviewed `
            -BoothRoutingReviewed -CueIsolationPreserved -RecordingCreated `
            -RecordingPlaybackReviewed -ZeroRecordingDropoutsObserved -RuntimeErrorReview
          if ($LASTEXITCODE -eq 0) { throw 'CI was allowed to generate M3 mixer/recording evidence.' }
          if (Test-Path .\must-not-exist.json) { throw 'CI generation wrote an M3 evidence file.' }
          $global:LASTEXITCODE = 0

          Write-Host 'M3 witness contract: complete fixture accepted; incomplete, spoofed, privacy-unsafe, wrong-identity/environment and CI-generation cases rejected.'
          exit 0

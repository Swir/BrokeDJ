name: M2 key-lock listening witness tool

on:
  pull_request:
    paths:
      - 'scripts/m2_keylock_listening_witness.ps1'
      - 'docs/M2_KEYLOCK_LISTENING_WITNESS.md'
      - 'docs/DEVELOPMENT_STATUS.md'
      - '.github/workflows/m2-keylock-witness-tool.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-witness-tool:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Parse PowerShell witness script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\m2_keylock_listening_witness.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host 'PowerShell parser: OK'

      - name: Validate listening evidence contract, atomic publication and CI guard
        shell: pwsh
        run: |
          Set-Content -LiteralPath .\BrokeDJ.exe -Value 'BrokeDJ M2 listening witness fixture executable' -NoNewline -Encoding ascii
          $appFile = Get-Item -LiteralPath .\BrokeDJ.exe
          $appHash = (Get-FileHash -LiteralPath .\BrokeDJ.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $appVersion = $appFile.VersionInfo.FileVersion
          if ([string]::IsNullOrWhiteSpace($appVersion)) { $appVersion = 'unknown' }

          $complete = [ordered]@{
            schema = 1
            project = 'BrokeDJ'
            scope = 'M2-key-lock-listening'
            generatedUtc = [DateTime]::UtcNow.ToString('o')
            environment = [ordered]@{
              windowsBuild = 26100
              architecture = 'X64'
              processArchitecture = 'X64'
            }
            app = [ordered]@{
              fileName = 'BrokeDJ.exe'
              fileVersion = [string]$appVersion
              sha256 = $appHash
            }
            material = [ordered]@{
              representativeTrackCount = 3
              userOwnedOrLicensed = $true
            }
            checks = [ordered]@{
              normalBaselineReviewed = $true
              slowKeyLockReviewed = $true
              fastKeyLockReviewed = $true
              transportFallbackReviewed = $true
              pitchStabilityAcceptable = $true
              noCriticalArtifactsObserved = $true
              runtimeErrorReview = $true
            }
            privacy = [ordered]@{
              containsDeviceNames = $false
              containsTrackPaths = $false
              containsTrackNames = $false
              containsSourceMusic = $false
            }
          }

          $complete | ConvertTo-Json -Depth 8 | Set-Content .\complete.json -Encoding utf8
          & pwsh -NoProfile -File .\scripts\m2_keylock_listening_witness.ps1 `
            -AppPath .\BrokeDJ.exe -EvidencePath .\complete.json -ValidateExisting
          if ($LASTEXITCODE -ne 0) { throw 'Complete M2 listening fixture was rejected.' }

          function Assert-Rejected([object]$Fixture, [string]$Path, [string]$Message) {
            $Fixture | ConvertTo-Json -Depth 8 | Set-Content $Path -Encoding utf8
            & pwsh -NoProfile -File .\scripts\m2_keylock_listening_witness.ps1 `
              -AppPath .\BrokeDJ.exe -EvidencePath $Path -ValidateExisting
            if ($LASTEXITCODE -eq 0) { throw $Message }
            $global:LASTEXITCODE = 0
          }

          $tooFewTracks = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $tooFewTracks.material.representativeTrackCount = 2
          Assert-Rejected $tooFewTracks '.\too-few-tracks.json' 'Too-small representative set was accepted.'

          $unlicensed = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $unlicensed.material.userOwnedOrLicensed = $false
          Assert-Rejected $unlicensed '.\unlicensed.json' 'Unlicensed-material attestation was accepted.'

          $spoofedBoolean = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $spoofedBoolean.checks.pitchStabilityAcceptable = 'true'
          Assert-Rejected $spoofedBoolean '.\spoofed-boolean.json' 'String boolean was accepted.'

          $spoofedCount = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $spoofedCount.material.representativeTrackCount = '3'
          Assert-Rejected $spoofedCount '.\spoofed-count.json' 'String representative count was accepted.'

          $incomplete = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $incomplete.checks.noCriticalArtifactsObserved = $false
          Assert-Rejected $incomplete '.\incomplete.json' 'Incomplete listening evidence was accepted.'

          $privacyLeak = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $privacyLeak.privacy.containsTrackPaths = $true
          Assert-Rejected $privacyLeak '.\privacy-leak.json' 'Privacy-unsafe evidence was accepted.'

          $extraField = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $extraField | Add-Member -NotePropertyName trackName -NotePropertyValue 'private'
          Assert-Rejected $extraField '.\extra-field.json' 'Unexpected free-form evidence field was accepted.'

          $appMismatch = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $appMismatch.app.sha256 = ('b' * 64)
          Assert-Rejected $appMismatch '.\app-mismatch.json' 'Wrong executable fingerprint was accepted.'

          $wrongArchitecture = $complete | ConvertTo-Json -Depth 8 | ConvertFrom-Json
          $wrongArchitecture.environment.architecture = 'X86'
          Assert-Rejected $wrongArchitecture '.\wrong-architecture.json' 'Non-x64 evidence was accepted.'

          foreach ($variable in @('CI', 'GITHUB_ACTIONS')) {
            $original = [Environment]::GetEnvironmentVariable($variable)
            try {
              foreach ($value in @('1', 'true', 'yes', 'on')) {
                Set-Item -Path "Env:$variable" -Value $value
                Remove-Item .\must-not-exist.json -ErrorAction SilentlyContinue
                $output = & pwsh -NoProfile -File .\scripts\m2_keylock_listening_witness.ps1 `
                  -AppPath .\path-that-must-not-exist\BrokeDJ.exe -EvidencePath .\must-not-exist.json `
                  -RepresentativeTrackCount 3 -UserOwnedOrLicensed `
                  -NormalBaselineReviewed -SlowKeyLockReviewed -FastKeyLockReviewed `
                  -TransportFallbackReviewed -PitchStabilityAcceptable `
                  -NoCriticalArtifactsObserved -RuntimeErrorReview 2>&1
                if ($LASTEXITCODE -eq 0) { throw "$variable=$value was allowed to generate M2 listening evidence." }
                if (($output | Out-String) -notmatch 'cannot be generated in CI') {
                  throw "$variable=$value did not fail at the CI guard before AppPath resolution. Output: $($output | Out-String)"
                }
                if (Test-Path .\must-not-exist.json) { throw "$variable=$value wrote an M2 evidence file." }
              }
            } finally {
              if ($null -eq $original) { Remove-Item -Path "Env:$variable" -ErrorAction SilentlyContinue }
              else { Set-Item -Path "Env:$variable" -Value $original }
            }
          }

          Copy-Item .\complete.json .\protected.json -Force
          $before = (Get-FileHash .\protected.json -Algorithm SHA256).Hash
          $ciOriginal = $env:CI
          $ghaOriginal = $env:GITHUB_ACTIONS
          try {
            Remove-Item Env:CI -ErrorAction SilentlyContinue
            Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
            & pwsh -NoProfile -File .\scripts\m2_keylock_listening_witness.ps1 `
              -AppPath .\BrokeDJ.exe -EvidencePath .\protected.json `
              -RepresentativeTrackCount 3 -UserOwnedOrLicensed `
              -NormalBaselineReviewed -SlowKeyLockReviewed -FastKeyLockReviewed `
              -TransportFallbackReviewed -PitchStabilityAcceptable -RuntimeErrorReview
            if ($LASTEXITCODE -ne 2) { throw "Incomplete generation returned $LASTEXITCODE instead of 2." }
          } finally {
            if ($null -eq $ciOriginal) { Remove-Item Env:CI -ErrorAction SilentlyContinue } else { $env:CI = $ciOriginal }
            if ($null -eq $ghaOriginal) { Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue } else { $env:GITHUB_ACTIONS = $ghaOriginal }
          }
          $after = (Get-FileHash .\protected.json -Algorithm SHA256).Hash
          if ($before -ne $after) { throw 'Incomplete generation replaced previously accepted M2 evidence.' }
          if (@(Get-ChildItem . -Filter '.BrokeDJ-M2-Witness-*.tmp' -Force).Count -ne 0) {
            throw 'Incomplete M2 generation left a temporary candidate behind.'
          }

          Write-Host 'M2 witness contract: complete fixture accepted; incomplete/spoofed/privacy-unsafe cases rejected; CI guard precedes AppPath resolution; incomplete retries preserve accepted evidence.'
          exit 0

name: Beta qualification host compatibility

on:
  pull_request:
    paths:
      - 'scripts/beta_qualification.ps1'
      - 'docs/BETA_QUALIFICATION.md'
      - '.github/workflows/beta-qualification-host-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-5:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Parse with built-in Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\beta_qualification.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          if ($PSVersionTable.PSEdition -ne 'Desktop') {
            throw "Expected Windows PowerShell Desktop edition, got $($PSVersionTable.PSEdition)."
          }
          Write-Host "Windows PowerShell parser/runtime: $($PSVersionTable.PSVersion)"

      - name: Reject truthy CI aliases before candidate access
        shell: powershell
        run: |
          $scriptPath = (Resolve-Path '.\scripts\beta_qualification.ps1').Path
          $cases = @(
            @{ Variable = 'CI'; Value = '1' },
            @{ Variable = 'CI'; Value = 'yes' },
            @{ Variable = 'CI'; Value = 'on' },
            @{ Variable = 'GITHUB_ACTIONS'; Value = '1' },
            @{ Variable = 'GITHUB_ACTIONS'; Value = 'yes' },
            @{ Variable = 'GITHUB_ACTIONS'; Value = 'on' }
          )

          foreach ($case in $cases) {
            $env:CI = 'false'
            $env:GITHUB_ACTIONS = 'false'
            Set-Item -Path ("Env:" + $case.Variable) -Value $case.Value

            $missingApp = Join-Path $PWD ("must-not-resolve-" + [Guid]::NewGuid().ToString('N') + '.exe')
            $outputPath = Join-Path $PWD ("must-not-write-" + [Guid]::NewGuid().ToString('N') + '.json')
            $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $scriptPath `
              -AppPath $missingApp -QualificationPath $outputPath 2>&1
            $exitCode = $LASTEXITCODE
            $text = ($output | Out-String)

            if ($exitCode -eq 0) {
              throw "CI guard accepted $($case.Variable)=$($case.Value)."
            }
            if ($text -notmatch 'human-controlled and cannot be generated in CI') {
              throw "CI guard did not fail before candidate access for $($case.Variable)=$($case.Value): $text"
            }
            if (Test-Path -LiteralPath $outputPath) {
              throw "CI guard wrote output for $($case.Variable)=$($case.Value)."
            }
          }

          Write-Host 'Windows PowerShell CI guard contract: truthy aliases rejected before candidate access.'

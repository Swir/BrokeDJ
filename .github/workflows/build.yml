name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core / sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check generated progress
        run: python3 scripts/update_progress.py --check
      - name: Test staged-package contract tool
        run: python3 scripts/package_contract.py self-test
      - name: Configure
        run: cmake -S . -B build/core -DBROKEDJ_BUILD_APP=OFF -DBROKEDJ_SANITIZE=ON -DBROKEDJ_BUILD_TIMESTRETCH_PROTOTYPE=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/core --parallel 2
      - name: Test
        run: ctest --test-dir build/core --output-on-failure
  windows:
    name: Windows x64 / development build
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure
        run: cmake --preset windows -DBROKEDJ_BUILD_TIMESTRETCH_PROTOTYPE=ON
      - name: Build
        run: cmake --build --preset windows-release --parallel 2
      - name: Test core
        run: ctest --preset windows-release
      - name: Capture audio render and callback diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows/diagnostics | Out-Null
          $log = & ctest --preset windows-release -V -R 'render_metrics|realtime_contract|time_stretch|deck_playback_selector|engine_keylock_source' 2>&1
          $exitCode = $LASTEXITCODE
          $log | Tee-Object -FilePath build/windows/diagnostics/audio-metrics.txt
          if ($exitCode -ne 0) { throw "Audio diagnostics failed: $exitCode" }
      - name: Native GUI lifecycle and resize smoke test (no audio hardware)
        shell: pwsh
        run: |
          $exe = Resolve-Path 'build/windows/BrokeDJ_artefacts/Release/BrokeDJ.exe'
          Remove-Item 'BrokeDJ-gui-smoke.json' -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'GUI smoke test timed out' }
          if ($p.ExitCode -ne 0) { throw "GUI smoke test failed: $($p.ExitCode)" }
          if (-not (Test-Path 'BrokeDJ-gui-smoke.json')) { throw 'GUI smoke JSON report missing' }

          $smoke = Get-Content 'BrokeDJ-gui-smoke.json' -Raw | ConvertFrom-Json
          if ($smoke.schema_version -ne 1 -or
              $smoke.mode -ne 'native-resize-lifecycle' -or
              $smoke.plays_audio -ne $false -or
              $smoke.opens_audio_device -ne $false -or
              $smoke.success -ne $true -or
              $smoke.step_count -ne 4 -or
              @($smoke.steps).Count -ne 4) {
            throw 'GUI smoke JSON contract is inconsistent'
          }
          foreach ($step in @($smoke.steps)) {
            if ($step.requested_width -lt 1050 -or $step.requested_height -lt 800 -or
                $step.window_width -ne $step.requested_width -or
                $step.window_height -ne $step.requested_height -or
                $step.content_width -le 0 -or $step.content_height -le 0) {
              throw 'GUI smoke resize step failed geometry validation'
            }
          }
          Copy-Item 'BrokeDJ-gui-smoke.json' build/windows/diagnostics/gui-smoke.json
      - name: Silent audio-device enumeration smoke
        shell: pwsh
        run: |
          $exe = Resolve-Path 'build/windows/BrokeDJ_artefacts/Release/BrokeDJ.exe'
          Remove-Item 'BrokeDJ-device-probe.txt' -ErrorAction SilentlyContinue
          Remove-Item 'BrokeDJ-device-probe.json' -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList '--device-probe-ci' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Device probe failed: $($p.ExitCode)" }
          if (-not (Test-Path 'BrokeDJ-device-probe.txt')) { throw 'Device probe text report missing' }
          if (-not (Test-Path 'BrokeDJ-device-probe.json')) { throw 'Device probe JSON report missing' }

          $probe = Get-Content 'BrokeDJ-device-probe.txt' -Raw
          if ($probe -notmatch 'schema_version=2' -or
              $probe -notmatch 'plays_audio=no' -or
              $probe -notmatch 'calls_device_open=no' -or
              $probe -notmatch 'starts_audio_callback=no' -or
              $probe -notmatch 'creates_device_descriptors=no' -or
              $probe -notmatch 'safety_invariants_ok=yes') {
            throw 'Device probe text report did not preserve CI safety invariants'
          }

          $probeJson = Get-Content 'BrokeDJ-device-probe.json' -Raw | ConvertFrom-Json
          if ($probeJson.schema_version -ne 2 -or
              $probeJson.mode -ne 'ci-enumeration' -or
              $probeJson.plays_audio -ne $false -or
              $probeJson.calls_device_open -ne $false -or
              $probeJson.starts_audio_callback -ne $false -or
              $probeJson.creates_device_descriptors -ne $false -or
              $probeJson.unexpected_open_state_count -ne 0 -or
              $probeJson.safety_invariants_ok -ne $true) {
            throw 'Device probe JSON safety/schema validation failed'
          }
          if (@($probeJson.backends).Count -ne $probeJson.backend_count) {
            throw 'Device probe JSON backend count is inconsistent'
          }
          foreach ($backend in @($probeJson.backends)) {
            if ($backend.descriptor_details_skipped -ne $true -or @($backend.devices).Count -ne 0) {
              throw 'CI probe unexpectedly created or serialized device descriptors'
            }
          }

          Copy-Item 'BrokeDJ-device-probe.txt' build/windows/diagnostics/device-probe-ci.txt
          Copy-Item 'BrokeDJ-device-probe.json' build/windows/diagnostics/device-probe-ci.json
      - name: Stage development build and corresponding project source
        shell: pwsh
        run: |
          cmake --install build/windows --config Release --prefix dist/BrokeDJ
          if ($LASTEXITCODE -ne 0) { throw 'Staging failed' }
          git archive --format=zip --output=dist/BrokeDJ-source.zip HEAD
          Copy-Item docs/TESTING.md dist/BrokeDJ/VALIDATION.md
          Copy-Item build/windows/diagnostics/audio-metrics.txt dist/BrokeDJ/AUDIO-DIAGNOSTICS.txt
          Copy-Item build/windows/diagnostics/gui-smoke.json dist/BrokeDJ/GUI-SMOKE.json
          Copy-Item build/windows/diagnostics/device-probe-ci.txt dist/BrokeDJ/DEVICE-PROBE-CI.txt
          Copy-Item build/windows/diagnostics/device-probe-ci.json dist/BrokeDJ/DEVICE-PROBE-CI.json
          Copy-Item scripts/m1_hardware_witness.ps1 dist/BrokeDJ/M1-HARDWARE-WITNESS.ps1
          Copy-Item docs/M1_HARDWARE_WITNESS.md dist/BrokeDJ/M1-HARDWARE-WITNESS.md
          Copy-Item scripts/m2_keylock_listening_witness.ps1 dist/BrokeDJ/M2-KEYLOCK-LISTENING-WITNESS.ps1
          Copy-Item docs/M2_KEYLOCK_LISTENING_WITNESS.md dist/BrokeDJ/M2-KEYLOCK-LISTENING-WITNESS.md
          Copy-Item scripts/m3_mixer_recording_witness.ps1 dist/BrokeDJ/M3-MIXER-RECORDING-WITNESS.ps1
          Copy-Item docs/M3_MIXER_RECORDING_WITNESS.md dist/BrokeDJ/M3-MIXER-RECORDING-WITNESS.md
          Copy-Item scripts/m4_library_witness.ps1 dist/BrokeDJ/M4-LIBRARY-WITNESS.ps1
          Copy-Item docs/M4_LIBRARY_WITNESS.md dist/BrokeDJ/M4-LIBRARY-WITNESS.md
          Copy-Item scripts/beta_qualification.ps1 dist/BrokeDJ/BETA-QUALIFICATION.ps1
          Copy-Item docs/BETA_QUALIFICATION.md dist/BrokeDJ/BETA-QUALIFICATION.md
          Copy-Item docs/BETA_PREVIEW.md dist/BrokeDJ/BETA-PREVIEW.md
          Set-Content -Path dist/BrokeDJ/SOURCE-COMMIT.txt -Value '${{ github.event.pull_request.head.sha || github.sha }}' -NoNewline -Encoding utf8
          Copy-Item scripts/package_contract.py dist/VERIFY-PACKAGE.py
          python scripts/package_contract.py create --root dist --commit '${{ github.event.pull_request.head.sha || github.sha }}' --cmake CMakeLists.txt
          if ($LASTEXITCODE -ne 0) { throw 'Package manifest creation failed' }
          python scripts/package_contract.py verify --root dist --expected-commit '${{ github.event.pull_request.head.sha || github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Package manifest verification failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BrokeDJ-0.1.0-development-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  package-smoke:
    name: Windows x64 / staged + portable artifact smoke
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: BrokeDJ-0.1.0-development-windows-x64
          path: package
      - name: Verify downloaded artifact manifest and checksums
        shell: pwsh
        run: |
          python package/VERIFY-PACKAGE.py verify --root package --expected-commit '${{ github.event.pull_request.head.sha || github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded package verification failed' }
          if (-not (Test-Path 'package/BrokeDJ/M1-HARDWARE-WITNESS.ps1')) { throw 'Packaged M1 witness script missing' }
          if (-not (Test-Path 'package/BrokeDJ/M1-HARDWARE-WITNESS.md')) { throw 'Packaged M1 witness guide missing' }
          if (-not (Test-Path 'package/BrokeDJ/M2-KEYLOCK-LISTENING-WITNESS.ps1')) { throw 'Packaged M2 key-lock listening witness script missing' }
          if (-not (Test-Path 'package/BrokeDJ/M2-KEYLOCK-LISTENING-WITNESS.md')) { throw 'Packaged M2 key-lock listening witness guide missing' }
          if (-not (Test-Path 'package/BrokeDJ/M3-MIXER-RECORDING-WITNESS.ps1')) { throw 'Packaged M3 mixer/recording witness script missing' }
          if (-not (Test-Path 'package/BrokeDJ/M3-MIXER-RECORDING-WITNESS.md')) { throw 'Packaged M3 mixer/recording witness guide missing' }
          if (-not (Test-Path 'package/BrokeDJ/M4-LIBRARY-WITNESS.ps1')) { throw 'Packaged M4 witness script missing' }
          if (-not (Test-Path 'package/BrokeDJ/M4-LIBRARY-WITNESS.md')) { throw 'Packaged M4 witness guide missing' }
          if (-not (Test-Path 'package/BrokeDJ/BETA-QUALIFICATION.ps1')) { throw 'Packaged Beta qualification script missing' }
          if (-not (Test-Path 'package/BrokeDJ/BETA-QUALIFICATION.md')) { throw 'Packaged Beta qualification guide missing' }
          if (-not (Test-Path 'package/BrokeDJ/BETA-PREVIEW.md')) { throw 'Packaged Beta Preview guide missing' }
      - name: Extract portable ZIP and run relocated no-audio smoke
        shell: pwsh
        run: |
          $archive = Resolve-Path 'package/BrokeDJ-Beta-Preview-Windows-x64.zip'
          $extractBase = Join-Path $PWD 'portable smoke Świr path'
          Remove-Item -LiteralPath $extractBase -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extractBase | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $extractBase -Force

          $entries = @(Get-ChildItem -LiteralPath $extractBase -Force)
          if ($entries.Count -ne 1 -or -not $entries[0].PSIsContainer) {
            throw 'Portable archive did not extract to exactly one versioned root directory'
          }
          $portableRoot = $entries[0].FullName
          $appDir = Join-Path $portableRoot 'BrokeDJ'
          $exe = Join-Path $appDir 'BrokeDJ.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'Portable archive did not contain BrokeDJ/BrokeDJ.exe'
          }

          $env:BROKEDJ_EXTRACTED_ROOT = $portableRoot
          $env:BROKEDJ_EXPECTED_COMMIT = '${{ github.event.pull_request.head.sha || github.sha }}'
          $verifyInner = "import importlib.util, os, pathlib; root=pathlib.Path(os.environ['BROKEDJ_EXTRACTED_ROOT']); spec=importlib.util.spec_from_file_location('brokedj_package_verify', root/'VERIFY-PACKAGE.py'); mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); mod.verify_contract(root, expected_commit=os.environ['BROKEDJ_EXPECTED_COMMIT'], verify_portable=False); print('verified extracted portable payload')"
          python -B -c $verifyInner
          if ($LASTEXITCODE -ne 0) { throw 'Extracted portable payload verification failed' }

          Push-Location $appDir
          try {
            Remove-Item 'BrokeDJ-gui-smoke.json' -ErrorAction SilentlyContinue
            Remove-Item 'BrokeDJ-device-probe.txt' -ErrorAction SilentlyContinue
            Remove-Item 'BrokeDJ-device-probe.json' -ErrorAction SilentlyContinue

            $gui = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WorkingDirectory $appDir -PassThru
            if (-not $gui.WaitForExit(30000)) { $gui.Kill(); throw 'Portable GUI smoke test timed out' }
            if ($gui.ExitCode -ne 0) { throw "Portable GUI smoke failed: $($gui.ExitCode)" }
            $smoke = Get-Content 'BrokeDJ-gui-smoke.json' -Raw | ConvertFrom-Json
            if ($smoke.schema_version -ne 1 -or
                $smoke.mode -ne 'native-resize-lifecycle' -or
                $smoke.plays_audio -ne $false -or
                $smoke.opens_audio_device -ne $false -or
                $smoke.success -ne $true -or
                $smoke.step_count -ne 4 -or
                @($smoke.steps).Count -ne 4) {
              throw 'Portable GUI smoke report failed contract validation'
            }

            $probe = Start-Process -FilePath $exe -ArgumentList '--device-probe-ci' -WorkingDirectory $appDir -PassThru -Wait
            if ($probe.ExitCode -ne 0) { throw "Portable device probe failed: $($probe.ExitCode)" }
            $probeJson = Get-Content 'BrokeDJ-device-probe.json' -Raw | ConvertFrom-Json
            if ($probeJson.schema_version -ne 2 -or
                $probeJson.mode -ne 'ci-enumeration' -or
                $probeJson.plays_audio -ne $false -or
                $probeJson.calls_device_open -ne $false -or
                $probeJson.starts_audio_callback -ne $false -or
                $probeJson.creates_device_descriptors -ne $false -or
                $probeJson.unexpected_open_state_count -ne 0 -or
                $probeJson.safety_invariants_ok -ne $true) {
              throw 'Portable device-probe report failed safety/schema validation'
            }
          }
          finally {
            Pop-Location
          }

          Remove-Item (Join-Path $appDir 'BrokeDJ-gui-smoke.json') -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $appDir 'BrokeDJ-device-probe.txt') -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $appDir 'BrokeDJ-device-probe.json') -ErrorAction SilentlyContinue
          python -B -c $verifyInner
          if ($LASTEXITCODE -ne 0) { throw 'Post-smoke extracted portable payload verification failed' }
      - name: Confirm staged M2 listening witness cannot generate evidence in CI
        shell: pwsh
        run: |
          Push-Location package/BrokeDJ
          try {
            Remove-Item 'BrokeDJ-M2-keylock-listening.json' -ErrorAction SilentlyContinue
            & pwsh -NoProfile -File .\M2-KEYLOCK-LISTENING-WITNESS.ps1 `
              -AppPath .\BrokeDJ.exe -EvidencePath .\BrokeDJ-M2-keylock-listening.json `
              -RepresentativeTrackCount 3 -UserOwnedOrLicensed `
              -NormalBaselineReviewed -SlowKeyLockReviewed -FastKeyLockReviewed `
              -TransportFallbackReviewed -PitchStabilityAcceptable `
              -NoCriticalArtifactsObserved -RuntimeErrorReview
            if ($LASTEXITCODE -eq 0) { throw 'Packaged M2 witness generated listening evidence in CI.' }
            if (Test-Path 'BrokeDJ-M2-keylock-listening.json') { throw 'Packaged M2 witness wrote evidence in CI.' }
            $global:LASTEXITCODE = 0
          }
          finally {
            Pop-Location
          }
      - name: Confirm staged M3 mixer/recording witness cannot generate evidence in CI
        shell: pwsh
        run: |
          Push-Location package/BrokeDJ
          try {
            Remove-Item 'BrokeDJ-M3-mixer-recording.json' -ErrorAction SilentlyContinue
            & pwsh -NoProfile -File .\M3-MIXER-RECORDING-WITNESS.ps1 `
              -AppPath .\BrokeDJ.exe -EvidencePath .\BrokeDJ-M3-mixer-recording.json `
              -ContinuousSessionMinutes 60 -RepresentativeTrackCount 3 -UserOwnedOrLicensed `
              -EqListeningReviewed -GainStagingReviewed -CrossfaderLawsReviewed `
              -LimiterBehaviorReviewed -MicrophoneInputReviewed -DuckingReviewed `
              -BoothRoutingReviewed -CueIsolationPreserved -RecordingCreated `
              -RecordingPlaybackReviewed -ZeroRecordingDropoutsObserved -RuntimeErrorReview
            if ($LASTEXITCODE -eq 0) { throw 'Packaged M3 witness generated qualification evidence in CI.' }
            if (Test-Path 'BrokeDJ-M3-mixer-recording.json') { throw 'Packaged M3 witness wrote evidence in CI.' }
            $global:LASTEXITCODE = 0
          }
          finally {
            Pop-Location
          }
      - name: Confirm staged Beta qualification cannot generate evidence in CI
        shell: pwsh
        run: |
          Push-Location package/BrokeDJ
          try {
            Remove-Item 'BrokeDJ-Beta-Qualification.json' -ErrorAction SilentlyContinue
            & pwsh -NoProfile -File .\BETA-QUALIFICATION.ps1 `
              -AppPath .\BrokeDJ.exe -QualificationPath .\BrokeDJ-Beta-Qualification.json
            if ($LASTEXITCODE -eq 0) { throw 'Packaged Beta qualifier generated human qualification evidence in CI.' }
            if (Test-Path 'BrokeDJ-Beta-Qualification.json') { throw 'Packaged Beta qualifier wrote evidence in CI.' }
            $global:LASTEXITCODE = 0
          }
          finally {
            Pop-Location
          }
      - name: Run staged no-audio lifecycle and device-probe smoke
        shell: pwsh
        run: |
          Push-Location package/BrokeDJ
          try {
            Remove-Item 'BrokeDJ-gui-smoke.json' -ErrorAction SilentlyContinue
            Remove-Item 'BrokeDJ-device-probe.txt' -ErrorAction SilentlyContinue
            Remove-Item 'BrokeDJ-device-probe.json' -ErrorAction SilentlyContinue

            $gui = Start-Process -FilePath '.\BrokeDJ.exe' -ArgumentList '--smoke-test' -PassThru
            if (-not $gui.WaitForExit(30000)) { $gui.Kill(); throw 'Staged GUI smoke test timed out' }
            if ($gui.ExitCode -ne 0) { throw "Staged GUI smoke failed: $($gui.ExitCode)" }
            $smoke = Get-Content 'BrokeDJ-gui-smoke.json' -Raw | ConvertFrom-Json
            if ($smoke.schema_version -ne 1 -or
                $smoke.mode -ne 'native-resize-lifecycle' -or
                $smoke.plays_audio -ne $false -or
                $smoke.opens_audio_device -ne $false -or
                $smoke.success -ne $true -or
                $smoke.step_count -ne 4) {
              throw 'Staged GUI smoke report failed contract validation'
            }

            $probe = Start-Process -FilePath '.\BrokeDJ.exe' -ArgumentList '--device-probe-ci' -PassThru -Wait
            if ($probe.ExitCode -ne 0) { throw "Staged device probe failed: $($probe.ExitCode)" }
            $probeJson = Get-Content 'BrokeDJ-device-probe.json' -Raw | ConvertFrom-Json
            if ($probeJson.schema_version -ne 2 -or
                $probeJson.mode -ne 'ci-enumeration' -or
                $probeJson.plays_audio -ne $false -or
                $probeJson.calls_device_open -ne $false -or
                $probeJson.starts_audio_callback -ne $false -or
                $probeJson.creates_device_descriptors -ne $false -or
                $probeJson.unexpected_open_state_count -ne 0 -or
                $probeJson.safety_invariants_ok -ne $true) {
              throw 'Staged device-probe report failed safety/schema validation'
            }
          }
          finally {
            Pop-Location
          }
      - name: Remove smoke outputs and re-verify publishable package
        shell: pwsh
        run: |
          Remove-Item 'package/BrokeDJ/BrokeDJ-gui-smoke.json' -ErrorAction SilentlyContinue
          Remove-Item 'package/BrokeDJ/BrokeDJ-device-probe.txt' -ErrorAction SilentlyContinue
          Remove-Item 'package/BrokeDJ/BrokeDJ-device-probe.json' -ErrorAction SilentlyContinue
          python package/VERIFY-PACKAGE.py verify --root package --expected-commit '${{ github.event.pull_request.head.sha || github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Post-smoke package verification failed' }
      - name: Publish smoke-qualified Beta Preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BrokeDJ-Beta-Preview-Windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

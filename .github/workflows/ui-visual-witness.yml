name: UI visual witness
on:
  pull_request:
    paths:
      - 'src/app/**'
      - 'scripts/capture_ui_smoke.ps1'
      - 'scripts/validate_ui_witness.ps1'
      - 'scripts/test_ui_witness_validator.ps1'
      - '.github/workflows/ui-visual-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-ui-visual:
    name: Windows x64 / UI pixel witness
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Self-test UI pixel validator
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/test_ui_witness_validator.ps1
          if ($LASTEXITCODE -ne 0) { throw "UI validator self-test failed: $LASTEXITCODE" }

      - name: Configure native Windows build
        run: cmake --preset windows -DBROKEDJ_BUILD_TIMESTRETCH_PROTOTYPE=ON

      - name: Build BrokeDJ
        run: cmake --build --preset windows-release --parallel 2

      - name: Capture compact and workstation Windows UI witnesses
        shell: pwsh
        run: |
          $exe = Resolve-Path 'build/windows/BrokeDJ_artefacts/Release/BrokeDJ.exe'
          pwsh -NoProfile -File scripts/capture_ui_smoke.ps1 `
            -ExePath $exe `
            -OutputDirectory 'build/windows/ui-visual-witness' `
            -TimeoutSeconds 30 `
            -StableCaptureMilliseconds 90
          if ($LASTEXITCODE -ne 0) { throw "UI visual witness failed: $LASTEXITCODE" }

      - name: Validate visual witness contract
        shell: pwsh
        run: |
          $root = 'build/windows/ui-visual-witness'
          $manifest = Get-Content "$root/BrokeDJ-ui-visual-witness.json" -Raw | ConvertFrom-Json
          if ($manifest.schema_version -ne 2 -or
              $manifest.mode -ne 'windows-ui-visual-witness' -or
              $manifest.plays_audio -ne $false -or
              $manifest.opens_audio_device -ne $false -or
              $manifest.smoke_success -ne $true -or
              $manifest.smoke_exercised_requested_1600x900 -ne $true -or
              $manifest.capture_settle_milliseconds -lt 40 -or
              $manifest.compact.stable_frame -ne $true -or
              $manifest.workstation.stable_frame -ne $true) {
            throw 'UI visual witness manifest failed settled-frame schema/safety validation.'
          }
          if ($manifest.compact.width -lt 1040 -or $manifest.compact.height -lt 760 -or $manifest.compact.bytes -lt 4096) {
            throw 'Compact UI witness dimensions/payload are invalid.'
          }
          if ($manifest.workstation.width -lt 1240 -or $manifest.workstation.height -lt 760 -or $manifest.workstation.bytes -lt 4096) {
            throw 'Workstation UI witness dimensions/payload are invalid.'
          }
          if ($manifest.workstation.capture_class -notin @('requested-1600-class', 'largest-observed-window-fallback')) {
            throw 'Workstation UI witness capture class is invalid.'
          }
          foreach ($file in @($manifest.compact.file, $manifest.workstation.file)) {
            if (-not (Test-Path "$root/$file")) { throw "UI witness image missing: $file" }
          }
          Copy-Item 'BrokeDJ-gui-smoke.json' "$root/BrokeDJ-gui-smoke.json"

      - name: Gate blank, corrupt, palette and full-surface regressions
        shell: pwsh
        run: |
          $root = 'build/windows/ui-visual-witness'
          pwsh -NoProfile -File scripts/validate_ui_witness.ps1 -WitnessDirectory $root
          if ($LASTEXITCODE -ne 0) { throw "UI pixel quality gate failed: $LASTEXITCODE" }
          $quality = Get-Content "$root/BrokeDJ-ui-quality.json" -Raw | ConvertFrom-Json
          if ($quality.schema_version -ne 2 -or
              $quality.mode -ne 'windows-ui-pixel-quality-gate' -or
              $quality.plays_audio -ne $false -or
              $quality.opens_audio_device -ne $false -or
              $quality.success -ne $true -or
              $quality.workstation.right_quarter_non_black_fraction -lt 0.80 -or
              $quality.workstation.bottom_quarter_non_black_fraction -lt 0.80) {
            throw 'UI pixel quality report failed schema/full-surface validation.'
          }

      - name: Upload Windows UI visual witness
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BrokeDJ-UI-Visual-Witness-Windows-x64
          path: build/windows/ui-visual-witness/
          if-no-files-found: error
          retention-days: 7

      - name: Upload failed visual witness diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BrokeDJ-UI-Visual-Witness-Diagnostics-Windows-x64
          path: build/windows/ui-visual-witness/
          if-no-files-found: warn
          retention-days: 3

name: M4 witness tool

on:
  pull_request:
    paths:
      - 'scripts/m4_library_witness.ps1'
      - 'docs/M4_LIBRARY_WITNESS.md'
      - '.github/workflows/m4-witness-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-witness-tool:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell witness script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\m4_library_witness.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host 'PowerShell parser: OK'

      - name: Validate evidence integrity and negative cases
        shell: pwsh
        run: |
          Set-Content -LiteralPath .\BrokeDJ.exe -Value 'BrokeDJ witness fixture executable' -NoNewline -Encoding ascii
          $fixtureHash = (Get-FileHash -LiteralPath .\BrokeDJ.exe -Algorithm SHA256).Hash.ToLowerInvariant()

          $complete = @{
            schema = 1
            project = 'BrokeDJ'
            scope = 'M4-library-workflow'
            generatedUtc = [DateTime]::UtcNow.ToString('o')
            environment = @{ windowsBuild = 26100; architecture = 'X64'; processArchitecture = 'X64' }
            app = @{ fileName = 'BrokeDJ.exe'; fileVersion = 'unknown'; sha256 = $fixtureHash }
            checks = @{
              launchAndResize = $true
              importAndSearch = $true
              tagsAndPlaylists = $true
              history = $true
              duplicateAndMissingReview = $true
              relocate = $true
              libraryBackupRestore = $true
              sessionSaveLoad = $true
            }
            privacy = @{ containsTrackPaths = $false; containsTrackNames = $false; containsSourceMusic = $false }
          }
          $complete | ConvertTo-Json -Depth 6 | Set-Content complete.json -Encoding utf8
          & pwsh -NoProfile -File .\scripts\m4_library_witness.ps1 `
            -AppPath .\BrokeDJ.exe -EvidencePath .\complete.json -ValidateExisting
          if ($LASTEXITCODE -ne 0) { throw 'Complete witness fixture was rejected.' }

          function Assert-Rejected([object]$Fixture, [string]$Path, [string]$Message) {
            $Fixture | ConvertTo-Json -Depth 6 | Set-Content $Path -Encoding utf8
            & pwsh -NoProfile -File .\scripts\m4_library_witness.ps1 `
              -AppPath .\BrokeDJ.exe -EvidencePath $Path -ValidateExisting
            if ($LASTEXITCODE -eq 0) { throw $Message }
            $global:LASTEXITCODE = 0
          }

          $incomplete = $complete | ConvertTo-Json -Depth 6 | ConvertFrom-Json
          $incomplete.checks.libraryBackupRestore = $false
          Assert-Rejected $incomplete '.\incomplete.json' 'Incomplete witness fixture was accepted.'

          $spoofedBoolean = $complete | ConvertTo-Json -Depth 6 | ConvertFrom-Json
          $spoofedBoolean.checks.history = 'true'
          Assert-Rejected $spoofedBoolean '.\spoofed-boolean.json' 'String boolean was accepted as evidence.'

          $spoofedSchema = $complete | ConvertTo-Json -Depth 6 | ConvertFrom-Json
          $spoofedSchema.schema = '1'
          Assert-Rejected $spoofedSchema '.\spoofed-schema.json' 'String schema version was accepted as evidence.'

          $spoofedBuild = $complete | ConvertTo-Json -Depth 6 | ConvertFrom-Json
          $spoofedBuild.environment.windowsBuild = '26100'
          Assert-Rejected $spoofedBuild '.\spoofed-build.json' 'String Windows build was accepted as evidence.'

          $privacyLeak = $complete | ConvertTo-Json -Depth 6 | ConvertFrom-Json
          $privacyLeak.privacy.containsTrackPaths = $true
          Assert-Rejected $privacyLeak '.\privacy-leak.json' 'Privacy-unsafe evidence was accepted.'

          $extraPrivateField = $complete | ConvertTo-Json -Depth 6 | ConvertFrom-Json
          $extraPrivateField.privacy | Add-Member -NotePropertyName localTrackPath -NotePropertyValue 'C:\private\fixture.wav'
          Assert-Rejected $extraPrivateField '.\extra-private-field.json' 'Unexpected private evidence field was accepted.'

          $extraTopLevelField = $complete | ConvertTo-Json -Depth 6 | ConvertFrom-Json
          $extraTopLevelField | Add-Member -NotePropertyName notes -NotePropertyValue 'free-form fields are not part of the evidence contract'
          Assert-Rejected $extraTopLevelField '.\extra-top-level-field.json' 'Unexpected top-level evidence field was accepted.'

          $fingerprintMismatch = $complete | ConvertTo-Json -Depth 6 | ConvertFrom-Json
          $fingerprintMismatch.app.sha256 = ('b' * 64)
          Assert-Rejected $fingerprintMismatch '.\fingerprint-mismatch.json' 'Wrong executable fingerprint was accepted.'

          Write-Host 'Evidence contract: exact app accepted; incomplete, type-spoofed, privacy-unsafe, extra-field and fingerprint-mismatched evidence rejected.'
          $global:LASTEXITCODE = 0
          exit 0
